[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "airwm"
version = "0.1.0"
description = "RGB-D aerial world-model experiments in Isaac Lab"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "torch>=2.7", "h5py>=3.11", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
airwm = "airwm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

